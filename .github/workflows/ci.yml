name: DevInspect AI CI/CD Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-codebase:
    name: Lint, Test, and Coverage Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-dir: '.'
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter Check
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test:run

      - name: Verify Test Coverage
        run: npm run coverage

  verify-containerization:
    name: Verify Docker Compilation
    runs-on: ubuntu-latest
    needs: validate-codebase

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: devinspect-ai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
